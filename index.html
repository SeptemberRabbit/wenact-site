<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吾为 · Wenact</title>
  <meta name="description" content="吾为 App 官方页面" />
  <style>
    :root {
      --ink: #1a2947;
      --muted: #667a94;
      --paper: #eef3f8;
      --card: #f8fafc;
      --accent: #2e6bb8;
      --line: rgba(26, 41, 71, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 560px at 15% -8%, rgba(46, 107, 184, 0.18), transparent 55%),
        radial-gradient(800px 480px at 100% 18%, rgba(120, 160, 200, 0.16), transparent 50%),
        var(--paper);
      line-height: 1.7;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    .wrap { max-width: 28rem; width: 100%; text-align: center; }
    h1 { font-size: 1.9rem; margin: 0 0 0.4rem; font-weight: 700; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; }
    .links { display: grid; gap: 0.75rem; }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 8px 28px rgba(26, 41, 71, 0.06);
    }
    a.card strong { display: block; color: var(--accent); margin-bottom: 0.2rem; }
    a.card span { font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>吾为</h1>
    <p class="sub">Wenact · 吾之行为即是吾之风水</p>
    <div class="links">
      <a class="card" href="./support.html">
        <strong>技术支持</strong>
        <span>问题反馈 · lzyuan108@163.com</span>
      </a>
      <a class="card" href="./privacy.html">
        <strong>隐私政策</strong>
        <span>我们如何处理你的信息</span>
      </a>
    </div>
  </div>
</body>
</html>
